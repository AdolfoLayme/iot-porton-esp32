<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portón IoT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #0c0f14; --panel: #141922; --panel2: #1b2230; --line: #263043;
    --text: #e8edf5; --muted: #8592a8;
    --ok: #3ddc97; --warn: #ffb547; --bad: #ff5d6c; --accent: #5b8cff;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, #1a2540 0%, var(--bg) 60%);
    color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px #ff5d6c22; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px #3ddc9722; }

  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: linear-gradient(180deg, var(--panel), #11161e); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 500; }

  /* Escena del portón (vista superior) */
  .scene { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background:
      repeating-linear-gradient(90deg, #1a2130 0 2px, transparent 2px 40px),
      repeating-linear-gradient(0deg, #1a2130 0 2px, transparent 2px 40px), #10151d; }
  .scene svg { width: 100%; height: 100%; display: block; }
  #hoja { transition: transform .16s linear; transform-origin: 120px 210px; }
  #beam { transition: opacity .2s; }
  .estado-big { display: flex; align-items: baseline; justify-content: space-between; margin-top: 16px; gap: 12px; flex-wrap: wrap; }
  #estadoTxt { font-size: 2rem; font-weight: 700; text-transform: capitalize; }
  #posTxt { font-family: "JetBrains Mono", monospace; font-size: 2rem; color: var(--muted); }
  .bar { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .16s linear; }

  /* Controles */
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 14px; padding: 18px 8px; font-size: 1.05rem; font-weight: 700; color: var(--text); background: var(--panel2); transition: transform .08s, background .2s, border-color .2s; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .b-open { background: #173a2c; border-color: #2a6b4f; } .b-open:hover { background: #1d4a38; }
  .b-stop { background: #3d3018; border-color: #6f5420; } .b-stop:hover { background: #4d3c1e; }
  .b-close { background: #3d1a20; border-color: #6e2a34; } .b-close:hover { background: #4d2129; }
  .slider { margin-top: 18px; }
  .slider label { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel2); border-radius: 12px; padding: 12px 14px; }
  .stat small { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
  .stat div { font-family: "JetBrains Mono", monospace; font-size: 1.35rem; font-weight: 600; margin-top: 4px; }
  #spark { width: 100%; height: 44px; margin-top: 8px; }

  .log { margin-top: 16px; }
  .log ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; font-family: "JetBrains Mono", monospace; font-size: .8rem; }
  .log li { padding: 7px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .log li time { color: var(--muted); flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Portón IoT <span>· canal <b id="canalTxt"></b></span></h1>
    <div class="pills">
      <div class="pill"><i class="dot" id="dotBroker"></i>Broker</div>
      <div class="pill"><i class="dot" id="dotEsp"></i>ESP32</div>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Vista del portón</h2>
      <div class="scene">
        <svg viewBox="0 0 400 250" aria-label="Vista superior del portón">
          <!-- calle -->
          <rect x="0" y="210" width="400" height="40" fill="#1a1f29"/>
          <line x1="0" y1="232" x2="400" y2="232" stroke="#3a4253" stroke-dasharray="14 10" stroke-width="2"/>
          <!-- muros -->
          <rect x="0" y="200" width="120" height="16" rx="3" fill="#2b3446"/>
          <rect x="320" y="200" width="80" height="16" rx="3" fill="#2b3446"/>
          <!-- sensor ultrasónico y haz -->
          <rect x="322" y="186" width="14" height="10" rx="2" fill="#5b8cff"/>
          <path id="beam" d="M322 191 L130 140 L130 240 Z" fill="#5b8cff" opacity=".08"/>
          <!-- obstáculo (aparece si distancia < umbral) -->
          <g id="obst" opacity="0"><circle cx="220" cy="208" r="14" fill="#ff5d6c"/><text x="220" y="213" text-anchor="middle" font-size="14" fill="#fff">!</text></g>
          <!-- arco de recorrido -->
          <path d="M320 210 A200 200 0 0 0 120 10" fill="none" stroke="#2b3446" stroke-dasharray="4 6"/>
          <!-- hoja del portón: gira sobre la bisagra (120,210) -->
          <g id="hoja">
            <rect x="120" y="203" width="200" height="14" rx="4" fill="#d9dee8"/>
            <g stroke="#9aa4b5" stroke-width="2">
              <line x1="150" y1="205" x2="150" y2="215"/><line x1="180" y1="205" x2="180" y2="215"/>
              <line x1="210" y1="205" x2="210" y2="215"/><line x1="240" y1="205" x2="240" y2="215"/>
              <line x1="270" y1="205" x2="270" y2="215"/><line x1="300" y1="205" x2="300" y2="215"/>
            </g>
          </g>
          <circle cx="120" cy="210" r="8" fill="#5b8cff"/>
          <circle cx="120" cy="210" r="3" fill="#0c0f14"/>
        </svg>
      </div>
      <div class="estado-big">
        <div id="estadoTxt">—</div>
        <div id="posTxt">0%</div>
      </div>
      <div class="bar"><div id="posBar"></div></div>
    </section>

    <section class="card">
      <h2>Control</h2>
      <div class="btns">
        <button class="b-open" data-cmd="abrir">Abrir</button>
        <button class="b-stop" data-cmd="parar">Parar</button>
        <button class="b-close" data-cmd="cerrar">Cerrar</button>
      </div>
      <div class="slider">
        <label><span>Apertura parcial</span><span id="sliderVal">50%</span></label>
        <input type="range" id="slider" min="0" max="100" step="5" value="50">
      </div>

      <div class="stats">
        <div class="stat"><small>Sensor</small><div id="distTxt">— cm</div></div>
        <div class="stat"><small>Latencia (ida+vuelta)</small><div id="latTxt">— ms</div></div>
      </div>
      <svg id="spark" viewBox="0 0 100 44" preserveAspectRatio="none"><polyline id="sparkLine" fill="none" stroke="#5b8cff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>

      <div class="log">
        <h2>Eventos</h2>
        <ul id="log"></ul>
      </div>
    </section>
  </div>
</div>

<script>
  // Mismo broker y prefijo que sketch.ino
  const BROKER = "wss://broker.emqx.io:8084/mqtt";
  // Canal propio por enlace: index.html?canal=porton-juan  (debe coincidir con TOPIC del sketch)
  const TOPIC = new URLSearchParams(location.search).get("canal") || "porton-adolfo-7f3k";
  const OBSTACULO_CM = 20;

  const $ = id => document.getElementById(id);
  $("canalTxt").textContent = TOPIC;
  const colores = { abierto: "var(--ok)", cerrado: "var(--muted)", abriendo: "var(--accent)", cerrando: "var(--accent)", detenido: "var(--warn)", obstaculo: "var(--bad)" };

  function log(texto) {
    const li = document.createElement("li");
    li.innerHTML = `<time>${new Date().toLocaleTimeString()}</time><span></span>`;
    li.lastChild.textContent = texto;
    $("log").prepend(li);
    while ($("log").children.length > 50) $("log").lastChild.remove();
  }

  const client = mqtt.connect(BROKER, { clientId: "panel-" + Math.random().toString(16).slice(2, 10), reconnectPeriod: 2000 });
  const enviar = cmd => client.publish(`${TOPIC}/cmd`, cmd);

  client.on("connect", () => {
    $("dotBroker").classList.add("on");
    client.subscribe([`${TOPIC}/estado`, `${TOPIC}/online`, `${TOPIC}/pong`, `${TOPIC}/evento`]);
    log("Conectado al broker");
  });
  client.on("close", () => $("dotBroker").classList.remove("on"));

  client.on("message", (topic, payload) => {
    const msg = payload.toString();
    const sub = topic.slice(TOPIC.length + 1);
    if (sub === "online") { $("dotEsp").classList.toggle("on", msg === "1"); if (msg !== "1") log("ESP32 desconectado"); }
    else if (sub === "evento") log(msg);
    else if (sub === "pong") medirPong(msg);
    else if (sub === "estado") pintar(JSON.parse(msg));
  });

  function pintar(e) {
    $("hoja").style.transform = `rotate(${-e.pos * 0.9}deg)`;   // 100% = 90°
    $("estadoTxt").textContent = e.estado === "obstaculo" ? "¡Obstáculo!" : e.estado;
    $("estadoTxt").style.color = colores[e.estado] || "var(--text)";
    $("posTxt").textContent = e.pos + "%";
    $("posBar").style.width = e.pos + "%";
    $("distTxt").textContent = e.dist >= 400 ? "libre" : e.dist + " cm";
    $("obst").setAttribute("opacity", e.dist < OBSTACULO_CM ? 1 : 0);
  }

  // Latencia: ping cada 2 s, el ESP32 lo devuelve por /pong
  const pendientes = new Map(), historial = [];
  setInterval(() => {
    if (!client.connected) return;
    const id = Math.random().toString(36).slice(2, 8);
    pendientes.set(id, performance.now());
    enviar("ping:" + id);
  }, 2000);

  function medirPong(msg) {
    const id = msg.slice(5), t0 = pendientes.get(id);
    if (t0 === undefined) return;
    pendientes.delete(id);
    const ms = Math.round(performance.now() - t0);
    historial.push(ms); if (historial.length > 30) historial.shift();
    const prom = Math.round(historial.reduce((a, b) => a + b, 0) / historial.length);
    $("latTxt").textContent = `${ms} ms`;
    $("latTxt").title = `promedio ${prom} ms`;
    const max = Math.max(...historial, 1);
    $("sparkLine").setAttribute("points", historial.map((v, i) => `${(i / 29) * 100},${44 - (v / max) * 40}`).join(" "));
  }

  document.querySelectorAll("button[data-cmd]").forEach(b => b.onclick = () => { enviar(b.dataset.cmd); log("Panel: " + b.dataset.cmd); });
  $("slider").oninput = e => $("sliderVal").textContent = e.target.value + "%";
  $("slider").onchange = e => { enviar("pos:" + e.target.value); log(`Panel: ir a ${e.target.value}%`); };
</script>
</body>
</html>
